<div
  class="inline-flex items-center gap-1 rounded-xl border border-line bg-surface p-1"
  role="group"
  aria-label="Appearance"
>
  @for (option of options; track option.value) {
    <button
      type="button"
      class="inline-flex size-9 items-center justify-center rounded-lg text-muted transition-colors hover:bg-hover hover:text-ink aria-pressed:bg-accent aria-pressed:text-on-accent"
      [attr.aria-label]="option.label"
      [attr.title]="option.label"
      [attr.aria-pressed]="theme.preference() === option.value"
      (click)="theme.setPreference(option.value)"
    >
      <app-icon [name]="option.icon" class="size-4" />
    </button>
  }
</div>
