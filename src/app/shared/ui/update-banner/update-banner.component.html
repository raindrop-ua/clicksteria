<div aria-live="polite" aria-atomic="true">
  @if (updates.notice(); as notice) {
    <section aria-labelledby="app-update-title" class="update-notice surface">
      <div>
        <h2 id="app-update-title">
          {{ notice === 'ready' ? 'A fresh version is ready' : 'A quick reload is needed' }}
        </h2>
        <p>
          {{
            notice === 'ready'
              ? 'Refresh to get the latest version.'
              : 'Reload Clicksteria to keep playing.'
          }}
          Unfinished games resume from the latest save.
        </p>
      </div>
      <button type="button" class="button button-primary" (click)="updates.reload()">
        {{ notice === 'ready' ? 'Refresh to update' : 'Reload game' }}
      </button>
    </section>
  }
</div>
