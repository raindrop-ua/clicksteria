<fieldset aria-describedby="block-style-help">
  <legend>Block style</legend>
  <div class="style-options">
    @for (option of styles; track option.id) {
      <button
        type="button"
        class="style-option"
        [attr.aria-pressed]="blockStyle.style() === option.id"
        [title]="option.description"
        (click)="blockStyle.setStyle(option.id)"
      >
        <span class="selection-mark" aria-hidden="true"></span>
        <span
          class="style-preview"
          [class.preview-classic]="option.id === 'classic'"
          [class.preview-no-symbols]="!symbols.enabled()"
          aria-hidden="true"
        >
          <span class="preview-block coral"></span>
          <span class="preview-block cyan"></span>
          <span class="preview-block green"></span>
        </span>
        <span>{{ option.label }}</span>
      </button>
    }
  </div>
</fieldset>
<p id="block-style-help" class="style-help">
  Classic has bouncy jelly blocks. Minimalist keeps the original look and motion.
</p>
