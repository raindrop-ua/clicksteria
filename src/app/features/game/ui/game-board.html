<div
  #grid
  class="board"
  data-board
  tabindex="0"
  role="grid"
  aria-label="Game board"
  aria-describedby="board-help"
  [attr.aria-rowcount]="config.rows"
  [attr.aria-colcount]="config.columns"
  [attr.aria-activedescendant]="activeTile() ? 'board-active-tile-' + activeTile()!.id : null"
  (pointerdown)="pointerDown()"
  (pointermove)="hover($event)"
  (pointerleave)="leave()"
  (click)="activate($event)"
  (focus)="focusBoard()"
  (blur)="blurBoard()"
  (keydown)="navigate($event)"
>
  <img
    class="board-backdrop"
    ngSrc="/images/board-night-lake.webp"
    alt=""
    aria-hidden="true"
    fill
    priority
    sizes="(min-width: 768px) 50vw, 100vw"
    draggable="false"
  />
  <canvas #canvas class="board-canvas" aria-hidden="true"></canvas>
  @if (activeTile(); as tile) {
    <div class="sr-only" role="row" [attr.aria-rowindex]="config.rows - tile.row">
      <span
        [id]="'board-active-tile-' + tile.id"
        role="gridcell"
        [attr.aria-colindex]="tile.column + 1"
        [attr.data-tile]="tile.id"
        [attr.aria-label]="
          labels[tile.color] +
          ', column ' +
          (tile.column + 1) +
          ', row from bottom ' +
          (tile.row + 1)
        "
        >{{ labels[tile.color] }}, column {{ tile.column + 1 }}, row from bottom
        {{ tile.row + 1 }}</span
      >
    </div>
  }
</div>
<p id="board-help" class="sr-only">
  Arrow keys move between blocks. Home and End move to the first and last column. Enter or Space
  removes a group. Tab leaves the board.
</p>
