<div class="new-game-controls">
  @if (confirming()) {
    <div class="confirmation" aria-label="Start a new game">
      <p role="status">Start over? Your current game will be lost.</p>
      <button
        type="button"
        class="button button-primary"
        (click)="confirming.set(false); newGame.emit()"
      >
        Yes, start a new game
      </button>
      <button type="button" class="button button-secondary" (click)="confirming.set(false)">
        Keep playing
      </button>
    </div>
  } @else {
    <button
      type="button"
      class="button button-primary new-game"
      [disabled]="!ready()"
      (click)="requestNew()"
    >
      <app-icon name="play" />New game
    </button>
  }
</div>
