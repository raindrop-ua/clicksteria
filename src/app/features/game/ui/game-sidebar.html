<aside class="menu-rail" aria-label="Game menu">
  <img
    class="rail-emblem"
    ngSrc="/images/branding/emblem.png"
    width="144"
    height="144"
    alt=""
    aria-hidden="true"
    priority
  />
  <div class="rail-intro">
    <h1>One more move.</h1>
    <p>A familiar game. A brighter break.</p>
  </div>
  <div class="rail-actions">
    <app-game-controls
      [canUndo]="canUndo()"
      [ready]="ready()"
      [status]="status()"
      (newGame)="newGame.emit()"
    />
    <app-game-help />
  </div>
  <p class="rail-note">No rush. No timer.</p>
  @if (ready()) {
    <p class="rail-games">
      Games played: <strong>{{ gamesPlayed() | number }}</strong>
    </p>
  }
</aside>
