<div class="result-overlay">
  <div data-result tabindex="-1" role="status" class="result-content">
    <p class="result-eyebrow">{{ status() === 'won' ? 'Beautifully played' : 'A little pause' }}</p>
    <h2>{{ status() === 'won' ? 'Board cleared!' : 'No moves left' }}</h2>
    <p class="result-message">
      {{
        status() === 'won'
          ? 'Nicely done! Clear-board bonus: +1,000 points.'
          : 'Undo a move and try a different path.'
      }}
    </p>
    <p class="result-score">{{ score() }} points</p>
    <button type="button" class="button button-primary" (click)="playAgain.emit()">
      Play again
    </button>
  </div>
</div>
