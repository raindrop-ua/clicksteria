<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clicksteria — Free Block-Matching Puzzle Game</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved choice before first paint; keep in sync with ThemeService.
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('clicksteria.theme');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch {}
        document.documentElement.dataset.theme = preference;
        const dark =
          preference === 'dark' ||
          (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#14131d' : '#f6f5f0';
      })();
    </script>
    <meta
      name="description"
      content="Play Clicksteria, a free and relaxing block-matching puzzle. Match colorful groups, clear the board, and beat your best score. No timer. No rush."
    />

    <link rel="canonical" href="https://clicksteria.com/play" />
